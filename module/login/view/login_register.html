    <div class="login-wrap">
        <div class="login-html">

            <!-- Logo de marca -->
            <div class="login-logo">
                <div class="login-logo-icon">
                    <span class="material-symbols-outlined">terrain</span>
                </div>
                <h1 class="login-logo-name">Mountain<span>Stride</span></h1>
                <p class="login-logo-sub">World Series &middot; Trail Running</p>
            </div>

            <!-- Tabs -->
            <div class="login-tabs">
                <input id="tab-1" type="radio" name="tab" class="sign-in" checked>
                <label for="tab-1" class="tab">Sign In</label>
                <input id="tab-2" type="radio" name="tab" class="sign-up">
                <label for="tab-2" class="tab">Sign Up</label>
            </div>

            <div class="login-form">

                <!-- Formulario Login -->
                <form id="login__form" method="POST">
                    <div class="sign-in-htm">
                        <div class="group">
                            <label for="username_log" class="label">Username</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">person</span>
                                <input id="username_log" type="text" class="input" name="username_log" placeholder="Your username">
                            </div>
                            <span id="error_username_log" class="error"></span>
                        </div>
                        <div class="group">
                            <label for="passwd_log" class="label">Password</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">lock</span>
                                <input id="passwd_log" type="password" class="input" name="passwd_log" placeholder="••••••••">
                            </div>
                            <span id="error_passwd_log" class="error"></span>
                        </div>
                        <div class="group">
                            <input type="submit" id="login" class="button" value="Sign In">
                        </div>
                        <div class="hr"></div>
                        <div class="foot-lnk">
                            <label for="tab-2">You don't have an account?</label>
                        </div>
                    </div>
                </form>

                <!-- Formulario Register -->
                <form id="register__form" method="post">
                    <div class="sign-up-htm">
                        <div class="group">
                            <label for="username_reg" class="label">Username</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">person</span>
                                <input id="username_reg" type="text" class="input" name="username_reg" placeholder="Choose a username">
                            </div>
                            <span id="error_username_reg" class="error"></span>
                        </div>
                        <div class="group">
                            <label for="passwd1_reg" class="label">Password</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">lock</span>
                                <input id="passwd1_reg" type="password" class="input" name="passwd1_reg" placeholder="Min. 8 characters">
                            </div>
                            <span id="error_passwd1_reg" class="error"></span>
                        </div>
                        <div class="group">
                            <label for="passwd2_reg" class="label">Repeat Password</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">lock_reset</span>
                                <input id="passwd2_reg" type="password" class="input" name="passwd2_reg" placeholder="Repeat your password">
                            </div>
                            <span id="error_passwd2_reg" class="error"></span>
                        </div>
                        <div class="group">
                            <label for="email_reg" class="label">Email Address</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">mail</span>
                                <input id="email_reg" type="email" class="input" name="email_reg" placeholder="your@email.com">
                            </div>
                            <span id="error_email_reg" class="error"></span>
                        </div>
                        <div class="group">
                            <input type="submit" id="register" class="button" value="Create Account">
                        </div>
                        <div class="hr"></div>
                        <div class="foot-lnk">
                            <label for="tab-1">Already a member? Sign in</label>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
