<script>
(function(){
  const slides=document.querySelectorAll('.hero-slide');
  const dots=document.querySelectorAll('.hero-dot');
  const progress=document.getElementById('heroProgress');
  const DURATION=5000;
  let current=0,timer;
  function heroGoTo(idx){slides[current].classList.remove('active');dots[current].classList.remove('active');current=idx;slides[current].classList.add('active');dots[current].classList.add('active');resetProgress();}
  function heroNext(){heroGoTo((current+1)%slides.length);}
  function heroPrev(){heroGoTo((current-1+slides.length)%slides.length);}
  function resetProgress(){clearTimeout(timer);progress.style.transition='none';progress.style.width='0%';setTimeout(function(){progress.style.transition='width '+DURATION+'ms linear';progress.style.width='100%';},30);timer=setTimeout(heroNext,DURATION);}
  window.heroGoTo=heroGoTo;window.heroNext=heroNext;window.heroPrev=heroPrev;
  resetProgress();
})();
</script>

<script>
function initCatCarousel(trackId, prevId, nextId, dotsId) {
  const track = document.getElementById(trackId);
  if (!track) return;
  const outer = track.parentElement;
  const dotsEl = document.getElementById(dotsId);
  let current = 0;

  function getVisible() {
    const w = outer.offsetWidth;
    if (w < 500) return 1;
    if (w < 800) return 2;
    return 3;
  }
  function totalPages() { return Math.max(1, track.children.length - getVisible() + 1); }
  function buildDots() {
    dotsEl.innerHTML = '';
    const n = totalPages();
    if (n <= 1) return;
    for (let i = 0; i < n; i++) {
      const d = document.createElement('button');
      d.className = 'cat-dot' + (i === current ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }
  function goTo(idx) {
    const n = totalPages();
    current = Math.max(0, Math.min(idx, n - 1));
    const gap = 18;
    const slideW = (outer.offsetWidth - gap * (getVisible() - 1)) / getVisible();
    track.style.transform = `translateX(-${current * (slideW + gap)}px)`;
    Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('active', i === current));
  }
  const prevBtn = document.getElementById(prevId);
  const nextBtn = document.getElementById(nextId);
  if (prevBtn && !prevBtn.dataset.bound) {
    prevBtn.addEventListener('click', () => goTo(current - 1));
    prevBtn.dataset.bound = '1';
  }
  if (nextBtn && !nextBtn.dataset.bound) {
    nextBtn.addEventListener('click', () => goTo(current + 1));
    nextBtn.dataset.bound = '1';
  }
  buildDots();
  goTo(0);
  window.addEventListener('resize', () => { buildDots(); goTo(0); });
}

function initEventsCarousel() {
  const track = document.getElementById('evTrack');
  if (!track) return;
  const outer = track.parentElement;
  const dotsEl = document.getElementById('evDots');
  let current = 0;

  function getVisible() {
    const w = outer.offsetWidth;
    if (w < 500) return 1;
    if (w < 800) return 2;
    return 3;
  }
  function totalPages() { return Math.max(1, track.children.length - getVisible() + 1); }
  function buildDots() {
    dotsEl.innerHTML = '';
    const n = totalPages();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('button');
      d.className = 'ev-dot-btn' + (i === current ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }
  function goTo(idx) {
    const n = totalPages();
    current = Math.max(0, Math.min(idx, n - 1));
    const gap = 20;
    const vis = getVisible();
    const slideW = (outer.offsetWidth - gap * (vis - 1)) / vis;
    track.style.transform = `translateX(-${current * (slideW + gap)}px)`;
    Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('active', i === current));
  }
  buildDots();
  goTo(0);
  window.addEventListener('resize', () => { buildDots(); goTo(0); });
}

window.initEventsCarousel = initEventsCarousel;
window.initCatCarousel = initCatCarousel;
</script>
