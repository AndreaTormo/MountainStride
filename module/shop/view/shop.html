<div id="map-all"></div>

<script>
function relatedSlideHtml(r) {
    return '<div class="cat-slide more_info_list" id="' + r.id_running + '">' +
        '<div class="user_card">' +
        '<div class="cat-img-wrap">' +
        '<img class="cat-img" src="' + (r.running_image || '') + '" alt="' + (r.running_name || '') + '" loading="lazy">' +
        '</div>' +
        '<div class="cat-body">' +
        '<p class="cat-name">' + (r.location || '') + ' ' + (r.running_name || '') + '</p>' +
        '</div></div></div>';
}

// ── Estado global del carousel ──────────────────────────────────────────────
var _rel = { items: [], loaded: 0, type: '', total: 0 };

function runnings_related(loadeds, type_running) {
    ajaxPromise("POST", "JSON", "module/shop/controller/controller_shop.php?op=runnings_related", {
        type: type_running, loaded: loadeds, items: 3,
        id_running: window._id_running_similar || ''
    }).then(function(data) {
        if (!Array.isArray(data)) return;
        data.forEach(function(r) { if (r.id_running !== undefined) _rel.items.push(r); });
        _rel.loaded = _rel.items.length;

        // Mostrar bloque y rellenar track
        var tc = document.getElementById('title_content');
        if (tc) tc.style.display = '';
        var track = document.getElementById('relatedTrack');
        if (track) {
            track.innerHTML = _rel.items.map(relatedSlideHtml).join('');
        }

        // Botón load more
        var moreBtn = document.querySelector('.more_running__button');
        if (moreBtn) {
            moreBtn.innerHTML = _rel.loaded < _rel.total
                ? '<button class="load_more_button">LOAD MORE</button>' : '';
        }

        // Reset flags de botones para que se re-bindeen
        ['relatedPrev','relatedNext'].forEach(function(id) {
            var b = document.getElementById(id);
            if (b) delete b.dataset.bound;
        });
        window._relatedCarouselResize = false;
        initRelatedCarousel();

    }).catch(function() { console.log("error runnings_related"); });
}

function more_running_related(type_running) {
    _rel.items  = [];
    _rel.loaded = 0;
    _rel.type   = type_running;
    _rel.total  = 0;
    window._relatedCarouselPage = 0;

    ajaxPromise('POST', 'JSON', 'module/shop/controller/controller_shop.php?op=count_running_related', {
        type: type_running, id_running: window._id_running_similar || ''
    }).then(function(data) {
        _rel.total = data[0].n_prod;
        runnings_related(0, type_running);

        $(document).off('click', '.load_more_button').on('click', '.load_more_button', function() {
            window._relatedCarouselPage = window._relatedCarouselPage || 0;
            runnings_related(_rel.loaded, _rel.type);
        });
    }).catch(function() { console.log('error count_running_related'); });
}

function initRelatedCarousel() {
    const track = document.getElementById('relatedTrack');
    if (!track || !track.children.length) return;
    const outer = track.parentElement;
    const dotsEl = document.getElementById('relatedDots');
    let current = window._relatedCarouselPage || 0;

    function getVisible() {
        const w = outer.offsetWidth;
        if (w < 500) return 1;
        if (w < 800) return 2;
        return 3;
    }
    function totalPages() { return Math.max(1, track.children.length - getVisible() + 1); }
    function buildDots() {
        if (!dotsEl) return;
        dotsEl.innerHTML = '';
        const n = totalPages();
        if (n <= 1) return;
        for (let i = 0; i < n; i++) {
            const d = document.createElement('button');
            d.className = 'cat-dot' + (i === current ? ' active' : '');
            d.addEventListener('click', function() { goTo(i); });
            dotsEl.appendChild(d);
        }
    }
    function goTo(idx) {
        const n = totalPages();
        current = Math.max(0, Math.min(idx, n - 1));
        window._relatedCarouselPage = current;
        const gap = 18;
        const vis = getVisible();
        const slideW = (outer.offsetWidth - gap * (vis - 1)) / vis;
        track.style.transform = 'translateX(-' + (current * (slideW + gap)) + 'px)';
        if (dotsEl) Array.from(dotsEl.children).forEach(function(d, i) {
            d.classList.toggle('active', i === current);
        });
    }
    const prevBtn = document.getElementById('relatedPrev');
    const nextBtn = document.getElementById('relatedNext');
    if (prevBtn && !prevBtn.dataset.bound) {
        prevBtn.addEventListener('click', function() { goTo(current - 1); });
        prevBtn.dataset.bound = '1';
    }
    if (nextBtn && !nextBtn.dataset.bound) {
        nextBtn.addEventListener('click', function() { goTo(current + 1); });
        nextBtn.dataset.bound = '1';
    }
    if (!window._relatedCarouselResize) {
        window._relatedCarouselResize = true;
        window.addEventListener('resize', function() {
            buildDots();
            goTo(window._relatedCarouselPage || 0);
        });
    }
    buildDots();
    goTo(current);
}
</script>
